<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Sharma Clinic — AI Receptionist Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #111;
    border: 1px solid #222;
    border-radius: 20px;
    padding: 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 30px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
  .info {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    text-align: left;
  }
  .info p { font-size: 13px; color: #aaa; margin-bottom: 6px; }
  .info p span { color: #fff; }
  .call-btn {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    padding: 16px 32px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.2s;
  }
  .call-btn:hover { opacity: 0.9; }
  .call-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    font-size: 13px;
    color: #888;
    min-height: 20px;
  }
  .status.active { color: #4ade80; }
  .powered { margin-top: 30px; font-size: 11px; color: #444; }
  .pulse {
    display: inline-block;
    width: 8px; height: 8px;
    background: #4ade80;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🏥</div>
  <h1>Dr. Sharma Clinic</h1>
  <p class="subtitle">AI Receptionist — Available 24/7</p>

  <div class="info">
    <p>📅 <span>Appointment Booking</span></p>
    <p>🕐 <span>Mon–Sat, 9 AM – 6 PM</span></p>
    <p>💰 <span>Consultation: ₹300</span></p>
    <p>🌐 <span>Hindi & English</span></p>
  </div>

  <button class="call-btn" id="callBtn" onclick="toggleCall()">
    📞 Talk to AI Receptionist
  </button>

  <div class="status" id="status">Click to start — works in browser, no app needed</div>
  <p class="powered">Powered by Qora Voice AI</p>
</div>

<!-- Official Vapi Web SDK -->
<script>
  var vapiInstance = null;
  const assistant = "314e9131-0984-4bd8-90a2-2cd5f24cb1ce";
  const apiKey = "7b1bfc35-455d-4b0a-acf0-99a9a858ebdf";
  const buttonConfig = {};

  (function (d, t) {
    var g = document.createElement(t),
      s = d.getElementsByTagName(t)[0];
    g.src =
      "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
    g.defer = true;
    g.async = true;
    s.parentNode.insertBefore(g, s);

    g.onload = function () {
      vapiInstance = window.vapiSDK.run({
        apiKey: apiKey,
        assistant: assistant,
        config: buttonConfig,
      });

      vapiInstance.on("call-start", function () {
        document.getElementById("callBtn").innerHTML = "🔴 End Call";
        document.getElementById("callBtn").style.background = "#ef4444";
        document.getElementById("status").innerHTML = '<span class="pulse"></span> Connected — speak in Hindi or English';
        document.getElementById("status").className = "status active";
      });

      vapiInstance.on("call-end", function () {
        document.getElementById("callBtn").innerHTML = "📞 Talk to AI Receptionist";
        document.getElementById("callBtn").style.background = "linear-gradient(135deg, #6366f1, #8b5cf6)";
        document.getElementById("status").textContent = "Call ended. Click to call again.";
        document.getElementById("status").className = "status";
      });

      vapiInstance.on("error", function (e) {
        console.error(e);
        document.getElementById("status").textContent = "Error. Please try again.";
      });
    };
  })(document, "script");

  function toggleCall() {
    if (!vapiInstance) {
      document.getElementById("status").textContent = "Loading... please wait and try again.";
      return;
    }
    vapiInstance.send({ type: "add-message", message: { role: "system", content: "User clicked call button" } });
    // Start or stop call
    try {
      vapiInstance.start(assistant);
    } catch(e) {
      vapiInstance.stop();
    }
  }
</script>

</body>
</html>
