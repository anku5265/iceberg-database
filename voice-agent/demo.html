<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Sharma Clinic — AI Receptionist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #111;
    border: 1px solid #222;
    border-radius: 20px;
    padding: 40px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 70px; height: 70px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 30px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
  .info {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    text-align: left;
  }
  .info p { font-size: 13px; color: #aaa; margin-bottom: 6px; }
  .info p:last-child { margin-bottom: 0; }
  .info span { color: #fff; }
  .btn {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border: none;
    padding: 16px 24px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.active { background: #dc2626; }
  .status { margin-top: 14px; font-size: 13px; color: #666; }
  .status.live { color: #4ade80; }
  .powered { margin-top: 24px; font-size: 11px; color: #333; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏥</div>
  <h1>Dr. Sharma Clinic</h1>
  <p class="subtitle">AI Receptionist — 24/7 Available</p>

  <div class="info">
    <p>📅 <span>Appointment Booking</span></p>
    <p>🕐 <span>Mon–Sat, 9 AM – 6 PM</span></p>
    <p>💰 <span>Consultation: ₹300</span></p>
    <p>🌐 <span>Hindi & English</span></p>
  </div>

  <button class="btn" id="btn" onclick="toggleCall()">
    📞 Talk to AI Receptionist
  </button>
  <p class="status" id="status">Click to connect — no app needed</p>
  <p class="powered">Powered by Qora Voice AI</p>
</div>

<script type="module">
  import Vapi from 'https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.2.0/dist/vapi.js';

  const PUBLIC_KEY = "7b1bfc35-455d-4b0a-acf0-99a9a858ebdf";
  const ASSISTANT_ID = "314e9131-0984-4bd8-90a2-2cd5f24cb1ce";

  const vapi = new Vapi(PUBLIC_KEY);
  let active = false;

  const btn = document.getElementById('btn');
  const status = document.getElementById('status');

  vapi.on('call-start', () => {
    active = true;
    btn.className = 'btn active';
    btn.innerHTML = '🔴 End Call';
    status.className = 'status live';
    status.textContent = '● Connected — speak in Hindi or English';
  });

  vapi.on('call-end', () => {
    active = false;
    btn.className = 'btn';
    btn.innerHTML = '📞 Talk to AI Receptionist';
    status.className = 'status';
    status.textContent = 'Call ended. Click to call again.';
  });

  vapi.on('error', (e) => {
    console.error('Vapi error:', e);
    btn.disabled = false;
    status.className = 'status';
    status.textContent = 'Error: ' + (e?.message || 'Try again');
  });

  window.toggleCall = function() {
    if (active) {
      vapi.stop();
    } else {
      btn.disabled = true;
      status.textContent = 'Connecting...';
      vapi.start(ASSISTANT_ID).then(() => {
        btn.disabled = false;
      }).catch(err => {
        btn.disabled = false;
        status.textContent = 'Failed to connect. Try again.';
        console.error(err);
      });
    }
  };
</script>
</body>
</html>
