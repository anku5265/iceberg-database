[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icebergdb"
version = "1.0.0"
description = "Iceberg DB — High-performance serverless vector database, hybrid RRF search, and 4-tier cognitive memory for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ankush", email = "contact@icebergdb.in" },
    { name = "Iceberg DB", email = "contact@icebergdb.in" }
]
keywords = ["vector database", "vector search", "rag", "ai agents", "embeddings", "semantic search", "mcp", "india"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://icebergdb.in"
Documentation = "https://icebergdb.in/docs"
Repository = "https://github.com/anku5265/iceberg-database"
Issues = "https://github.com/anku5265/iceberg-database/issues"
