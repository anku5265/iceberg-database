[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icebergdb"
version = "0.1.0"
description = "Iceberg — High-performance serverless vector database for AI agents and RAG applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Iceberg Data Technologies", email = "hello@icebergdb.in" }
]
keywords = ["vector database", "vector search", "rag", "ai agents", "embeddings", "semantic search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://icebergdb.in"
Documentation = "https://icebergdb.in/docs"
Repository = "https://github.com/icebergdb/iceberg"
Issues = "https://github.com/icebergdb/iceberg/issues"
