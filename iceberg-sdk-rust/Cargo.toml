[package]
name = "iceberg"
version = "0.1.0"
edition = "2021"
description = "Official Rust client for Iceberg Vector Database"
homepage = "https://icebergdb.io"
repository = "https://github.com/iceberg-db/iceberg-sdk-rust"
license = "MIT"
keywords = ["vector", "search", "ai", "embeddings", "rag"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
