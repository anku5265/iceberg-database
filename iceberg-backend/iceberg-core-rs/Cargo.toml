[package]
name = "iceberg-core-rs"
version = "1.0.0"
edition = "2021"
description = "IcebergCore v1.0.0 — Native Multi-Threaded Vector, Hybrid Okapi BM25, Quantization & Cognitive Memory Engine"
authors = ["Ankush <contact@icebergdb.in>"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
parking_lot = "0.12"
rayon = "1.10"
crc32fast = "1.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
