    <script>
      document.documentElement.classList.add('js-enabled');
      (function () {
        try {
          var path = window.location.pathname || '/';
          var search = window.location.search || '';
          var isRoot = path === '/' || path === '/index.html';
          var stayOnSite = search.indexOf('home=1') !== -1 || search.indexOf('site=1') !== -1 || search.indexOf('landing=1') !== -1;
          var hasSessionCookie = /(?:^|;\s*)ib_session=1(?:;|$)/.test(document.cookie || '');
          var hasLocalKey = false;
          try { hasLocalKey = !!localStorage.getItem('iceberg_api_key'); } catch (e) {}
          if (isRoot && !stayOnSite && (hasSessionCookie || hasLocalKey)) {
            window.location.replace('https://dashboard.icebergdb.in/');
            return;
          }
          if (isRoot && !stayOnSite) {
            window.addEventListener('message', function (ev) {
              if (ev && ev.data && ev.data.type === 'ICEBERG_SESSION_STATUS' && ev.data.loggedIn) {
                document.cookie = 'ib_session=1; Domain=.icebergdb.in; Path=/; Max-Age=31536000; SameSite=Lax; Secure';
                window.location.replace('https://dashboard.icebergdb.in/');
              }
            });
            window.addEventListener('DOMContentLoaded', function () {
              var ifr = document.createElement('iframe');
              ifr.src = 'https://dashboard.icebergdb.in/session-bridge.html';
              ifr.style.cssText = 'width:0;height:0;border:0;position:absolute;visibility:hidden;pointer-events:none;';
              ifr.setAttribute('aria-hidden', 'true');
              document.body.appendChild(ifr);
            });
          }
        } catch (e) {}
      })();
    </script>
